<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KnowledgePart - AI-Powered Online Chatbot & Intelligent Code Studio">
    <meta name="theme-color" content="#4f46e5">
    <title>KnowledgePart - AI Chatbot & Code Studio</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #111827;
            --bg-card-hover: #1f2937;
            --bg-sidebar: #0d1322;
            --bg-editor: #090d16;
            --border: #1f293d;
            --border-light: #374151;
            
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;
            
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        [data-theme="light"] {
            --bg-dark: #f8fafc;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --bg-sidebar: #f1f5f9;
            --bg-editor: #ffffff;
            --border: #e2e8f0;
            --border-light: #cbd5e1;
            
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-ui);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            height: 56px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 18px;
            color: var(--text-main);
            text-decoration: none;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
        }

        .brand span {
            color: var(--primary);
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .repo-badge {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: var(--bg-card-hover);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            opacity: 0.9;
            color: white;
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: white;
            border: none;
        }

        /* MAIN APP LAYOUT */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* SIDEBAR - FILE EXPLORER */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            user-select: none;
        }

        .sidebar-title {
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 2px;
            border-radius: 4px;
        }

        .icon-btn:hover {
            color: var(--text-main);
        }

        .repo-input-box {
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            gap: 4px;
        }

        .input-group input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 8px;
            color: var(--text-main);
            font-size: 11px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.15s;
        }

        .file-item:hover {
            background: var(--bg-card-hover);
            color: var(--text-main);
        }

        .file-item.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            font-weight: 600;
            border-left: 3px solid var(--primary);
        }

        .file-icon {
            width: 16px;
            text-align: center;
            font-size: 13px;
        }

        /* EDITOR WORKSPACE */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-editor);
            overflow: hidden;
        }

        /* TAB BAR */
        .tab-bar {
            height: 38px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            overflow-x: auto;
            padding-left: 8px;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            height: 38px;
            background: transparent;
            border-right: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            transition: all 0.15s;
        }

        .tab:hover {
            background: var(--bg-card-hover);
            color: var(--text-main);
        }

        .tab.active {
            background: var(--bg-editor);
            color: var(--primary);
            font-weight: 600;
            border-top: 2px solid var(--primary);
        }

        .tab-close {
            font-size: 10px;
            border-radius: 50%;
            padding: 2px 4px;
        }

        .tab-close:hover {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        /* EDITOR TOOLBAR */
        .editor-toolbar {
            height: 40px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--bg-card-hover);
        }

        /* CODE CONTAINER */
        .code-container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .line-numbers {
            width: 44px;
            padding: 12px 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            color: var(--text-dim);
            font-family: var(--font-code);
            font-size: 12px;
            line-height: 1.6;
            text-align: right;
            padding-right: 10px;
            user-select: none;
        }

        .editor-textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-code);
            font-size: 13px;
            line-height: 1.6;
            padding: 12px 16px;
            resize: none;
            outline: none;
            white-space: pre;
            overflow: auto;
            tab-size: 2;
        }

        /* DIFF VIEW CONTAINER */
        .diff-container {
            display: none;
            flex: 1;
            background: var(--bg-editor);
            overflow: auto;
            padding: 16px;
            font-family: var(--font-code);
            font-size: 12px;
            line-height: 1.5;
        }

        .diff-line {
            padding: 2px 8px;
            white-space: pre-wrap;
            border-radius: 2px;
        }

        .diff-add {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .diff-del {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .diff-header {
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        /* RIGHT PANEL - AI CHATBOT */
        .chat-panel {
            width: 380px;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .chat-header {
            padding: 12px 16px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-title {
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .model-select-badge {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--primary);
            font-size: 11px;
            padding: 2px 6px;
            outline: none;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .avatar-ai {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
        }

        .avatar-user {
            background: var(--border-light);
            color: var(--text-main);
        }

        .bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.user .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.ai .bubble {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        .bubble pre {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            margin: 8px 0;
            overflow-x: auto;
            position: relative;
        }

        .bubble code {
            font-family: var(--font-code);
            font-size: 11px;
        }

        .code-actions {
            margin-top: 6px;
            display: flex;
            gap: 6px;
        }

        .code-act-btn {
            background: var(--bg-card-hover);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
        }

        .code-act-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        /* CHAT INPUT AREA */
        .chat-input-box {
            padding: 12px;
            border-top: 1px solid var(--border);
            background: var(--bg-sidebar);
        }

        .prompt-chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 4px;
        }

        .chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s;
        }

        .chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
        }

        .chat-textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 12px;
            resize: none;
            outline: none;
            max-height: 80px;
            min-height: 24px;
        }

        .send-icon-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            align-self: flex-end;
        }

        .send-icon-btn:hover {
            background: var(--primary-hover);
        }

        /* MODALS & OVERLAYS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 440px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 12px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <a href="#" class="brand">
            <div class="brand-icon"><i class="fa-solid fa-brain"></i></div>
            <div>Knowledge<span>Part</span></div>
        </a>

        <div class="header-center">
            <div class="repo-badge" id="activeRepoBadge">
                <i class="fa-solid fa-code-branch"></i>
                <span id="activeRepoName">babakane/KnowledgePart</span>
            </div>
        </div>

        <div class="header-actions">
            <button class="btn" onclick="openSettingsModal()"><i class="fa-solid fa-gear"></i> Settings</button>
            <button class="btn" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
            <a href="docs/" target="_blank" class="btn btn-primary"><i class="fa-solid fa-book"></i> Docs</a>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="app-container">
        <!-- SIDEBAR - FILES & REPO -->
        <div class="sidebar">
            <div class="sidebar-title">
                <span><i class="fa-regular fa-folder-open"></i> Project Files</span>
                <div class="sidebar-title-actions">
                    <button class="icon-btn" title="New File" onclick="createNewFile()"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <div class="repo-input-box">
                <div class="input-group">
                    <input type="text" id="repoInput" placeholder="owner/repo (e.g. facebook/react)" />
                    <button class="btn btn-primary" onclick="loadGitHubRepo()"><i class="fa-solid fa-download"></i></button>
                </div>
            </div>

            <div class="file-tree" id="fileTree">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- WORKSPACE - EDITOR & DIFF -->
        <div class="workspace">
            <!-- TAB BAR -->
            <div class="tab-bar" id="tabBar">
                <!-- Dynamically populated -->
            </div>

            <!-- EDITOR TOOLBAR -->
            <div class="editor-toolbar">
                <div class="tool-group">
                    <button class="tool-btn" onclick="runAiAction('explain')"><i class="fa-solid fa-lightbulb" style="color: #f59e0b;"></i> Explain</button>
                    <button class="tool-btn" onclick="runAiAction('fix')"><i class="fa-solid fa-bug" style="color: #ef4444;"></i> Fix Bugs</button>
                    <button class="tool-btn" onclick="runAiAction('refactor')"><i class="fa-solid fa-bolt" style="color: #10b981;"></i> Refactor</button>
                    <button class="tool-btn" onclick="runAiAction('test')"><i class="fa-solid fa-flask" style="color: #8b5cf6;"></i> Unit Tests</button>
                    <button class="tool-btn" onclick="runAiAction('doc')"><i class="fa-solid fa-file-lines" style="color: #3b82f6;"></i> Auto Doc</button>
                </div>
                <div class="tool-group">
                    <button class="tool-btn" id="diffToggleBtn" onclick="toggleDiffView()"><i class="fa-solid fa-code-compare"></i> Compare Diff</button>
                    <button class="tool-btn" onclick="formatCode()"><i class="fa-solid fa-broom"></i> Format</button>
                </div>
            </div>

            <!-- CODE CONTAINER -->
            <div class="code-container" id="editorView">
                <div class="line-numbers" id="lineNumbers">1</div>
                <textarea class="editor-textarea" id="codeEditor" spellcheck="false" oninput="onEditorInput()"></textarea>
            </div>

            <!-- DIFF CONTAINER -->
            <div class="diff-container" id="diffView">
                <div class="diff-header" id="diffHeader">No AI modifications pending</div>
                <div id="diffContent"></div>
            </div>
        </div>

        <!-- RIGHT PANEL - CHATBOT -->
        <div class="chat-panel">
            <div class="chat-header">
                <div class="chat-title">
                    <i class="fa-solid fa-robot" style="color: var(--primary);"></i>
                    <span>AI Assistant</span>
                </div>
                <select class="model-select-badge" id="modelSelect" onchange="onModelChange()">
                    <option value="sandbox">🟢 Sandbox (Offline)</option>
                    <option value="gemini-1.5-flash">✨ Gemini 1.5 Flash</option>
                    <option value="gemini-2.0-flash">🚀 Gemini 2.0 Flash</option>
                    <option value="gemini-1.5-pro">⭐ Gemini 1.5 Pro</option>
                </select>
            </div>

            <div class="chat-messages" id="chatMessages">
                <!-- Messages populated dynamically -->
            </div>

            <div class="chat-input-box">
                <div class="prompt-chips">
                    <div class="chip" onclick="sendQuickPrompt('Explain current code file')">📖 Explain file</div>
                    <div class="chip" onclick="sendQuickPrompt('Find performance bugs')">🐛 Find bugs</div>
                    <div class="chip" onclick="sendQuickPrompt('Optimize algorithm')">⚡ Optimize</div>
                    <div class="chip" onclick="sendQuickPrompt('Write unit tests')">🧪 Write tests</div>
                </div>

                <div class="input-wrapper">
                    <textarea class="chat-textarea" id="chatInput" placeholder="Ask AI assistant... (Enter to send)" onkeydown="onChatKeydown(event)"></textarea>
                    <button class="send-icon-btn" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">⚙️ Settings</div>
                <button class="icon-btn" onclick="closeSettingsModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="form-group">
                <label>Google Gemini API Key</label>
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
                <small style="color: var(--text-dim); display: block; margin-top: 4px;">Get a free API Key at <a href="https://aistudio.google.com" target="_blank" style="color: var(--primary);">aistudio.google.com</a></small>
            </div>
            <div class="form-group">
                <label>GitHub Personal Token (Optional for private repos)</label>
                <input type="password" id="githubTokenInput" placeholder="ghp_..." />
            </div>
            <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="saveSettings()">Save Settings</button>
        </div>
    </div>

    <!-- APPLICATION ENGINE -->
    <script>
        // ══════════════════════════════════════════════════════════════════════
        // STATE MANAGEMENT
        // ══════════════════════════════════════════════════════════════════════
        const state = {
            files: [
                {
                    name: 'main.js',
                    language: 'javascript',
                    content: `// Welcome to KnowledgePart AI Code Studio!\n// Try clicking "Explain", "Fix Bugs", or "Refactor" in the toolbar above.\n\nfunction calculateTotal(items) {\n  let total = 0;\n  for (let i = 0; i < items.length; i++) {\n    total += items[i].price * items[i].quantity;\n  }\n  return total;\n}\n\nconst cart = [\n  { name: 'Laptop', price: 999, quantity: 1 },\n  { name: 'Mouse', price: 29, quantity: 2 }\n];\n\nconsole.log('Total Price:', calculateTotal(cart));`
                },
                {
                    name: 'app.py',
                    language: 'python',
                    content: `# Python Sample\ndef greet_user(name: str) -> str:\n    """Generate a friendly greeting message."""\n    if not name:\n        return "Hello, Guest!"\n    return f"Hello, {name}! Welcome to KnowledgePart AI."\n\nif __name__ == "__main__":\n    print(greet_user("Developer"))`
                },
                {
                    name: 'styles.css',
                    language: 'css',
                    content: `/* CSS Stylesheet */\nbody {\n  background: #090d16;\n  color: #f3f4f6;\n  font-family: 'Inter', sans-serif;\n}\n\n.card {\n  border: 1px solid #1f293d;\n  border-radius: 8px;\n  padding: 16px;\n}`
                }
            ],
            activeFileIndex: 0,
            openTabIndices: [0, 1, 2],
            apiKey: localStorage.getItem('knowledge_api_key') || '',
            githubToken: localStorage.getItem('knowledge_github_token') || '',
            currentModel: localStorage.getItem('knowledge_model') || 'sandbox',
            chatHistory: [],
            isDiffActive: false,
            lastProposedCode: '',
            isLoading: false
        };

        // ══════════════════════════════════════════════════════════════════════
        // INITIALIZATION
        // ══════════════════════════════════════════════════════════════════════
        document.addEventListener('DOMContentLoaded', () => {
            renderFileTree();
            renderTabs();
            loadActiveFileContent();
            
            document.getElementById('modelSelect').value = state.currentModel;
            document.getElementById('apiKeyInput').value = state.apiKey;
            document.getElementById('githubTokenInput').value = state.githubToken;
            
            addSystemMessage('👋 Welcome to KnowledgePart AI Assistant. Select code and click an action or ask anything below!');
        });

        // ══════════════════════════════════════════════════════════════════════
        // FILE MANAGEMENT & TREE
        // ══════════════════════════════════════════════════════════════════════
        function renderFileTree() {
            const treeEl = document.getElementById('fileTree');
            treeEl.innerHTML = '';
            
            state.files.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = `file-item ${index === state.activeFileIndex ? 'active' : ''}`;
                item.onclick = () => selectFile(index);
                
                const icon = getFileIcon(file.name);
                item.innerHTML = `
                    <span class="file-icon">${icon}</span>
                    <span>${escapeHtml(file.name)}</span>
                `;
                treeEl.appendChild(item);
            });
        }

        function getFileIcon(filename) {
            if (filename.endsWith('.js')) return '<i class="fa-brands fa-js" style="color: #f7df1e;"></i>';
            if (filename.endsWith('.py')) return '<i class="fa-brands fa-python" style="color: #387eb8;"></i>';
            if (filename.endsWith('.css')) return '<i class="fa-brands fa-css3-alt" style="color: #264de4;"></i>';
            if (filename.endsWith('.html')) return '<i class="fa-brands fa-html5" style="color: #e34f26;"></i>';
            if (filename.endsWith('.json')) return '<i class="fa-solid fa-code" style="color: #f59e0b;"></i>';
            return '<i class="fa-regular fa-file-code"></i>';
        }

        function selectFile(index) {
            state.activeFileIndex = index;
            if (!state.openTabIndices.includes(index)) {
                state.openTabIndices.push(index);
            }
            renderFileTree();
            renderTabs();
            loadActiveFileContent();
            if (state.isDiffActive) toggleDiffView();
        }

        function renderTabs() {
            const tabBar = document.getElementById('tabBar');
            tabBar.innerHTML = '';
            
            state.openTabIndices.forEach((fileIdx) => {
                const file = state.files[fileIdx];
                if (!file) return;
                
                const tab = document.createElement('div');
                tab.className = `tab ${fileIdx === state.activeFileIndex ? 'active' : ''}`;
                tab.onclick = () => selectFile(fileIdx);
                
                tab.innerHTML = `
                    <span>${getFileIcon(file.name)}</span>
                    <span>${escapeHtml(file.name)}</span>
                    <span class="tab-close" onclick="closeTab(event, ${fileIdx})"><i class="fa-solid fa-xmark"></i></span>
                `;
                tabBar.appendChild(tab);
            });
        }

        function closeTab(event, fileIdx) {
            event.stopPropagation();
            state.openTabIndices = state.openTabIndices.filter(i => i !== fileIdx);
            if (state.openTabIndices.length === 0) {
                state.activeFileIndex = -1;
                document.getElementById('codeEditor').value = '';
                document.getElementById('lineNumbers').innerText = '1';
            } else if (state.activeFileIndex === fileIdx) {
                selectFile(state.openTabIndices[0]);
            } else {
                renderTabs();
            }
        }

        function createNewFile() {
            const name = prompt('Enter new file name (e.g. utils.js, index.html):');
            if (!name) return;
            
            const ext = name.split('.').pop().toLowerCase();
            const newFile = {
                name,
                language: ext,
                content: `// File: ${name}\n`
            };
            state.files.push(newFile);
            selectFile(state.files.length - 1);
        }

        function loadActiveFileContent() {
            const file = state.files[state.activeFileIndex];
            const editor = document.getElementById('codeEditor');
            if (file) {
                editor.value = file.content;
                updateLineNumbers();
            }
        }

        function onEditorInput() {
            const editor = document.getElementById('codeEditor');
            const file = state.files[state.activeFileIndex];
            if (file) {
                file.content = editor.value;
            }
            updateLineNumbers();
        }

        function updateLineNumbers() {
            const editor = document.getElementById('codeEditor');
            const lines = editor.value.split('\n').length;
            const numbersEl = document.getElementById('lineNumbers');
            numbersEl.innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
        }

        // ══════════════════════════════════════════════════════════════════════
        // GITHUB REPO LOADER
        // ══════════════════════════════════════════════════════════════════════
        async function loadGitHubRepo() {
            const repoInput = document.getElementById('repoInput').value.trim();
            if (!repoInput) {
                alert('Please enter a GitHub repo path (e.g. babakane/KnowledgePart)');
                return;
            }
            
            try {
                addSystemMessage(`🔍 Fetching GitHub repository contents for: ${repoInput}...`);
                const headers = {};
                if (state.githubToken) {
                    headers['Authorization'] = `token ${state.githubToken}`;
                }
                
                const res = await fetch(`https://api.github.com/repos/${repoInput}/contents`, { headers });
                if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
                
                const items = await res.json();
                const fetchedFiles = [];
                
                for (const item of items.slice(0, 8)) {
                    if (item.type === 'file' && !item.name.startsWith('.')) {
                        const fileRes = await fetch(item.download_url);
                        const content = await fileRes.text();
                        fetchedFiles.push({
                            name: item.name,
                            language: item.name.split('.').pop(),
                            content: content
                        });
                    }
                }
                
                if (fetchedFiles.length > 0) {
                    state.files = fetchedFiles;
                    state.openTabIndices = fetchedFiles.map((_, i) => i);
                    state.activeFileIndex = 0;
                    document.getElementById('activeRepoName').innerText = repoInput;
                    renderFileTree();
                    renderTabs();
                    loadActiveFileContent();
                    addSystemMessage(`✅ Successfully loaded ${fetchedFiles.length} files from ${repoInput}`);
                } else {
                    addSystemMessage(`⚠️ No code files found in root of ${repoInput}`);
                }
            } catch (err) {
                addSystemMessage(`❌ Failed to load repo: ${err.message}`);
            }
        }

        // ══════════════════════════════════════════════════════════════════════
        // AI TOOLBAR ACTIONS & DIFF ENGINE
        // ══════════════════════════════════════════════════════════════════════
        async function runAiAction(action) {
            const file = state.files[state.activeFileIndex];
            if (!file) {
                alert('No active file selected!');
                return;
            }
            
            const promptMap = {
                'explain': `Explain how this code works in detail:\n\`\`\`${file.language}\n${file.content}\n\`\`\``,
                'fix': `Analyze and fix any bugs in this code:\n\`\`\`${file.language}\n${file.content}\n\`\`\`\nProvide the fixed code block first!`,
                'refactor': `Refactor this code for better readability and performance:\n\`\`\`${file.language}\n${file.content}\n\`\`\`\nProvide the refactored code block first!`,
                'test': `Write unit tests for this file:\n\`\`\`${file.language}\n${file.content}\n\`\`\``,
                'doc': `Add JSDoc / docstrings to this code:\n\`\`\`${file.language}\n${file.content}\n\`\`\``
            };

            const promptText = promptMap[action];
            if (!promptText) return;
            
            addMessage(`[Action: ${action.toUpperCase()}] Requesting AI analysis for ${file.name}...`, true);
            
            try {
                const response = await fetchAiResponse(promptText);
                addMessage(response, false);
                
                // Extract code snippet if present to offer Diff Comparison
                const codeMatch = response.match(/```(?:\w+)?\n([\s\S]*?)```/);
                if (codeMatch && (action === 'fix' || action === 'refactor' || action === 'doc')) {
                    state.lastProposedCode = codeMatch[1];
                    showDiff(file.content, state.lastProposedCode);
                }
            } catch (err) {
                addMessage(`⚠️ Error: ${err.message}`, false);
            }
        }

        function formatCode() {
            const editor = document.getElementById('codeEditor');
            let content = editor.value;
            // Simple clean up
            content = content.replace(/[ \t]+$/gm, '').replace(/\n{3,}/g, '\n\n');
            editor.value = content;
            onEditorInput();
            addSystemMessage('🧹 Code formatted cleanly.');
        }

        function showDiff(original, proposed) {
            const diffView = document.getElementById('diffView');
            const editorView = document.getElementById('editorView');
            const diffContent = document.getElementById('diffContent');
            const diffHeader = document.getElementById('diffHeader');
            
            editorView.style.display = 'none';
            diffView.style.display = 'block';
            state.isDiffActive = true;
            
            diffHeader.innerHTML = `
                <span>AI Proposed Modifications</span>
                <button class="btn btn-primary" onclick="applyProposedDiff()" style="padding: 2px 8px; font-size: 11px;">Apply Code to Editor</button>
            `;
            
            const origLines = original.split('\n');
            const propLines = proposed.split('\n');
            let html = '';
            
            origLines.forEach(l => {
                if (!propLines.includes(l)) {
                    html += `<div class="diff-line diff-del">- ${escapeHtml(l)}</div>`;
                }
            });
            
            propLines.forEach(l => {
                if (!origLines.includes(l)) {
                    html += `<div class="diff-line diff-add">+ ${escapeHtml(l)}</div>`;
                } else {
                    html += `<div class="diff-line">  ${escapeHtml(l)}</div>`;
                }
            });
            
            diffContent.innerHTML = html;
        }

        function toggleDiffView() {
            const diffView = document.getElementById('diffView');
            const editorView = document.getElementById('editorView');
            
            if (state.isDiffActive) {
                diffView.style.display = 'none';
                editorView.style.display = 'flex';
                state.isDiffActive = false;
            } else {
                if (state.lastProposedCode) {
                    const file = state.files[state.activeFileIndex];
                    showDiff(file ? file.content : '', state.lastProposedCode);
                } else {
                    alert('No AI modifications pending to compare.');
                }
            }
        }

        function applyProposedDiff() {
            if (!state.lastProposedCode) return;
            const file = state.files[state.activeFileIndex];
            if (file) {
                file.content = state.lastProposedCode;
                loadActiveFileContent();
                toggleDiffView();
                addSystemMessage('✅ Applied AI modifications to editor!');
            }
        }

        // ══════════════════════════════════════════════════════════════════════
        // AI CHATBOT ENGINE
        // ══════════════════════════════════════════════════════════════════════
        function onModelChange() {
            const modelSelect = document.getElementById('modelSelect');
            state.currentModel = modelSelect.value;
            localStorage.setItem('knowledge_model', state.currentModel);
            addSystemMessage(`Model changed to: ${modelSelect.options[modelSelect.selectedIndex].text}`);
        }

        function sendQuickPrompt(promptText) {
            const input = document.getElementById('chatInput');
            input.value = promptText;
            sendChatMessage();
        }

        function onChatKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendChatMessage();
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || state.isLoading) return;
            
            addMessage(text, true);
            input.value = '';
            
            try {
                const response = await fetchAiResponse(text);
                addMessage(response, false);
            } catch (err) {
                addMessage(`⚠️ Error: ${err.message}`, false);
            }
        }

        async function fetchAiResponse(userMessage) {
            if (state.currentModel !== 'sandbox') {
                if (!state.apiKey) {
                    throw new Error('Please set your Google Gemini API Key in Settings to use live Gemini models.');
                }
                return await fetchGeminiApi(userMessage);
            }
            return fetchSandboxAiResponse(userMessage);
        }

        async function fetchGeminiApi(userMessage) {
            const model = state.currentModel || 'gemini-1.5-flash';
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(state.apiKey.trim())}`;
            
            const activeFile = state.files[state.activeFileIndex];
            const contextText = activeFile ? `\n\n[Active File Context: ${activeFile.name}]\n\`\`\`${activeFile.language}\n${activeFile.content}\n\`\`\`` : '';
            
            const contents = [
                { role: 'user', parts: [{ text: userMessage + contextText }] }
            ];

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents,
                    generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
                })
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error?.message || `HTTP ${response.status}`);
            }

            return data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response generated.';
        }

        function fetchSandboxAiResponse(userMessage) {
            const lower = userMessage.toLowerCase();
            const activeFile = state.files[state.activeFileIndex];
            const code = activeFile ? activeFile.content : '';
            
            if (lower.includes('explain')) {
                return `### 📖 Code Explanation\n\nAnalyzing **${activeFile ? activeFile.name : 'active snippet'}**:\n\n1. **Purpose:** Performs computation and data handling.\n2. **Structure:** Uses functional modular blocks for clean execution.\n3. **Key Logic:** Data is validated and returned cleanly.\n\n\`\`\`javascript\n// Refactored example:\nconst result = calculateTotal(items);\nconsole.log(result);\n\`\`\``;
            }
            
            if (lower.includes('fix') || lower.includes('bug')) {
                return `### 🐛 Bug Fix Suggestions\n\nFound potential null/undefined reference risks in **${activeFile ? activeFile.name : 'code'}**.\n\n\`\`\`javascript\n// Safe implementation:\nfunction calculateTotal(items) {\n  if (!Array.isArray(items)) return 0;\n  return items.reduce((acc, item) => acc + (item.price || 0) * (item.quantity || 1), 0);\n}\n\`\`\``;
            }

            if (lower.includes('refactor') || lower.includes('optimize')) {
                return `### ⚡ Refactoring Recommendations\n\nOptimized version using modern ES6 syntax:\n\n\`\`\`javascript\nconst calculateTotal = (items = []) => \n  items.reduce((sum, { price = 0, quantity = 1 }) => sum + price * quantity, 0);\n\`\`\``;
            }

            if (lower.includes('test')) {
                return `### 🧪 Generated Unit Tests\n\n\`\`\`javascript\ndescribe('${activeFile ? activeFile.name : 'Functions'}', () => {\n  test('should calculate total correctly', () => {\n    const data = [{ price: 100, quantity: 2 }];\n    expect(calculateTotal(data)).toBe(200);\n  });\n});\n\`\`\``;
            }

            return `I'm operating in **Offline Sandbox Mode**.\n\nTo connect to live **Google Gemini API**, enter your API key in **Settings** (top right) and select a Gemini model!`;
        }

        function addMessage(text, isUser = false) {
            const chatMessages = document.getElementById('chatMessages');
            const msgEl = document.createElement('div');
            msgEl.className = `message ${isUser ? 'user' : 'ai'}`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${isUser ? 'avatar-user' : 'avatar-ai'}`;
            avatar.innerHTML = isUser ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            if (isUser) {
                bubble.textContent = text;
            } else {
                if (typeof marked !== 'undefined' && typeof marked.parse === 'function') {
                    bubble.innerHTML = marked.parse(text);
                } else {
                    bubble.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
                }
            }
            
            if (isUser) {
                msgEl.appendChild(bubble);
                msgEl.appendChild(avatar);
            } else {
                msgEl.appendChild(avatar);
                msgEl.appendChild(bubble);
            }
            
            chatMessages.appendChild(msgEl);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addSystemMessage(text) {
            addMessage(`ℹ️ ${text}`, false);
        }

        // ══════════════════════════════════════════════════════════════════════
        // MODALS & THEME
        // ══════════════════════════════════════════════════════════════════════
        function openSettingsModal() {
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveSettings() {
            state.apiKey = document.getElementById('apiKeyInput').value.trim();
            state.githubToken = document.getElementById('githubTokenInput').value.trim();
            
            localStorage.setItem('knowledge_api_key', state.apiKey);
            localStorage.setItem('knowledge_github_token', state.githubToken);
            
            closeSettingsModal();
            addSystemMessage('✓ Settings updated successfully!');
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            document.getElementById('themeIcon').className = newTheme === 'light' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }
    </script>
</body>
